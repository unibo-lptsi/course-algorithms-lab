# Calendario dei laboratori (A.A. 2026/27).
#
# Ogni venerdì una GitHub Action del repository privato dei lab pubblica su questo branch:
#   - il testo e i sorgenti (senza soluzioni) dei lab in programma nei giorni successivi, in asd-labs/<lab>/
#   - le soluzioni dei lab già svolti, in solutions/<lab>/
# e aggiorna il calendario nel README.md. I nomi dei lab sono le cartelle labs/<lab>/ del repository privato.
#
# Regole (modificabili):
#   - testo pubblicato a partire da <date> - exercise_lead_days  (6: il venerdì prima di un lab di lunedì)
#   - soluzioni pubblicate a partire da <date> + solutions_delay_days  (1: il venerdì dopo)
#   - per singola voce: `publish: <data>` anticipa/posticipa il testo,
#     `solutions: <data>` sposta le soluzioni, `solutions: false` non le pubblica mai.

timezone: Europe/Rome
exercise_lead_days: 6
solutions_delay_days: 1
exercises_dir: asd-labs
solutions_dir: solutions

calendar:
  - date: 2026-10-05
    labs: [testing]
  - date: 2026-10-12
    labs: [recursion]
  - date: 2026-10-19
    labs: [time]
  - date: 2026-10-26
    labs: [plotting, search]
  - date: 2026-11-02
    labs: [sorting]
  - date: 2026-11-09
    labs: [dynamic-arrays]
  - date: 2026-11-16
    labs: [hashtables]
  - date: 2026-11-23
    labs: [graphs]
  - date: 2026-11-30
    labs: [bst]
  - date: 2026-12-21
    labs: [hashtable-open, queues]
